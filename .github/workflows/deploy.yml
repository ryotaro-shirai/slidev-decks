name: Build & Deploy Slidev

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build all decks
        run: |
          mkdir -p dist
          for dir in */; do
            # slides.md があるディレクトリのみ処理
            if [ -f "${dir}slides.md" ]; then
              deck="${dir%/}"
              echo "Building: $deck"

              # GitHub Pages 用 HTML（/deck名/ のパスに配置）
              npx slidev build "${deck}/slides.md" \
                --out "../dist/${deck}" \
                --base "/${deck}/"

              # PDF 生成
              npx slidev export "${deck}/slides.md" \
                --output "dist/${deck}.pdf"
            fi
          done

      - name: Generate index page
        run: |
          cat <<'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="ja">
          <head><meta charset="UTF-8"><title>Slide Decks</title></head>
          <body>
            <h1>Slide Decks</h1>
            <ul id="list"></ul>
            <script>
              // デッキ一覧を自動生成（実運用ではJekyllやスクリプトで生成推奨）
            </script>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
